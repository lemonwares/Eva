<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to EVA Local</title>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body style="font-family: 'Red Hat Display', -apple-system, sans-serif; background: #e9e9e9; margin: 0; padding: 40px 20px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;">

  <div style="width: 100%; max-width: 500px; margin: 0 auto;">

    <!-- Logo -->
    <div style="text-align: center; margin-bottom: 4px;">
      <img src="https://res.cloudinary.com/duy8dw0cx/image/upload/brand/eva-logo-dark.png" alt="evalocal" style="max-width: 120px; height: auto;" />
    </div>

    <!-- Body -->
    <div style="width: 100%;">

      <h3 style="letter-spacing: 0.5px; color: #0097b2; font-size: 18px; font-weight: 700; margin: 0 0 12px;">
        Welcome, {{name}}!
      </h3>

      <p style="color: #374151; font-size: 14px; line-height: 1.7; margin: 0 0 20px;">
        Thank you for joining EVA Local — the premier platform for discovering exceptional event vendors across the UK. Whether you're planning a wedding, corporate event, or cultural celebration, we're here to help you find the perfect match.
      </p>

      <!-- CTA -->
      <div style="width: 100%; display: flex; justify-content: center; margin-bottom: 20px;">
        <a href="{{appUrl}}/vendors" style="background-color: #0097b2; color: #ffffff; padding: 11px 28px; border-radius: 5px; text-decoration: none; font-size: 14px; font-weight: 600; display: inline-block;">
          Start Exploring
        </a>
      </div>

      <!-- Contact -->
      <div style="text-align: center;">
        <a href="mailto:hello@evalocal.com" style="color: #374151; font-size: 13px; text-decoration: none;">hello@evalocal.com</a>
      </div>

    </div>
  </div>

</body>
</html>
